coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Dynamic catalog management is required by the trino_catalog resource. With
# catalog.store=memory the coordinator ignores etc/catalog/*.properties, so the
# acceptance catalogs are created over SQL by ../init-catalogs.sh.
catalog.management=dynamic
catalog.store=memory
