# Compares the supported Trino matrix with the upstream release window and opens
# (or updates) exactly one issue when the matrix lags. It never edits the matrix
# itself: a human or an agent lands the bump pull request.
#
# The comparison is the reusable workflow in caberdo/terraform-provider-kit.
name: Version matrix freshness

on:
  schedule:
    # Monthly, on the first day at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-freshness.yml@v0.2.0
    # `issues: write` opens or updates the single stale-matrix issue.
    permissions:
      contents: read
      issues: write
    with:
      provider-display: Trino
      versions-file: .github/trino-versions.txt
      upstream: trinodb/trino
      # Trino's releases are tagged `v476` while the matrix holds bare `476`.
      strip-v: true
