# Monitors the Trino maintenance window: compares the supported matrix with the
# upstream releases, canaries the newest release the matrix does not cover, and
# checks this repository's kit pin. Each job reports at most one labelled issue
# and closes it when the finding goes away. The workflow never edits the matrix
# or the pin: the bump stays a decision.
#
# One weekly cron (Monday 06:00 UTC) drives all three jobs. A caller file cannot
# bind two crons to different jobs, and the maintainer chose weekly for the
# canary. Re-checking the version window weekly costs one API call and updates
# the existing issue in place, so the quieter monthly cadence buys nothing.
name: Version maintenance

on:
  schedule:
    # Weekly, Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-freshness.yml@v0.17.0
    # `issues: write` opens or updates one labelled issue per category;
    # `actions: read` lets the canary report read the failing job's log.
    permissions:
      contents: read
      issues: write
      actions: read
    with:
      provider-display: Trino
      versions-file: .github/trino-versions.txt
      upstream: trinodb/trino
      # Trino publishes stable releases under bare tags (`484`), exactly as the
      # matrix holds them, so no prefix is stripped. Non-release tags such as
      # `477-test` exist but are not GitHub releases and never reach this list.
      strip-v: false
      # No suffix is stripped: the stable tag is bare (`484`).
      strip-suffix: ""
      canary: true
      version-env: TRINO_VERSION
      expect-version-env: TRINO_EXPECT_VERSION
      # The canary's unit profile must cover the same packages the Test
      # workflow does.
      packages: ./internal/...
      kit-check: true
