# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.15.0
    # GitHub validates a caller's grant against every job of the called workflow
    # before any `if:` or input is evaluated, so these are the union of what
    # provider-ci declares, not what this run happens to execute:
    #
    # - `contents: write` + `pull-requests: write`: requested unconditionally by
    #   the called `docs` job. Omitting them rejects the whole run with "The
    #   nested job 'docs' is requesting 'contents: write, pull-requests: write'"
    #   — even though `docs-mode: none` means that job only explains itself.
    # - `security-events: write`: the `Lint & Security` job uploads gosec SARIF
    #   to code scanning.
    #
    # This does not widen the token any other job runs with: every other job in
    # provider-ci.yml re-declares `contents: read` (and nothing else), and a
    # called job can narrow the caller's grant, never widen it.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    with:
      provider: trino
      provider-display: Trino
      module: github.com/caberdo/terraform-provider-trino
      # The matrix source of truth, named here so it cannot drift from the
      # acceptance call below. Trino has no versions job (`versions-job` stays
      # at its `false` default), so nothing reads it in this caller yet.
      versions-file: .github/trino-versions.txt
      # A release pull request is the only change that moves the changelog's
      # newest section, and that section names the version. The check compares
      # it with the README install constraint and reports the last tag beside
      # the verdict (pending release / released), never requiring it, so the
      # release pull request itself passes.
      changelog: true
      # Every pull request that can change what a user sees carries a fragment
      # in changelog.d/ instead of editing CHANGELOG.md.
      changelog-fragments: true
      # Dependency scanning stays in the Lint & Security job, through
      # `./scripts/govulncheck.sh` and its accepted-findings list. The default
      # (`action`) would move it into a separate Vulnerability Scan job.
      govuln-mode: script
      # Replay the committed fuzz seed corpora without exploring new inputs.
      fuzz: true
      # The generated docs must not drift; `docs-mode: none` keeps the check in
      # the Test job, where it lives today.
      docs: true
      # Re-check the coverage sentence in README.md from the Test job. Its
      # `make coverage-gate` wording is tfkit's default, so the check needs no
      # flag and guards the one line the kit migration changed.
      coverage-readme-in-test: true
      # Keeps the Coverage section of the job summary byte-identical.
      coverage-note: "Unit tests only: acceptance tests require `TF_ACC` and a live Trino coordinator."

  # Trino gates acceptance on the CI result on every trigger, pull requests and
  # the merge queue included. A caller cannot express `needs.<job>.result`
  # across a reusable-workflow boundary, so `needs: ci` is the only faithful
  # spelling: a failing or skipped `ci` skips acceptance, exactly as a failing
  # `test` did before.
  #
  # This gate is slightly wider than today's: it covers every `ci` job, not only
  # `test` (which already needed `lint`). Inert now — the extra jobs are skipped
  # or no-op — but it becomes live if `markdown`, `dependency-review` or
  # `coverage-job` is ever enabled: a failure there would then skip acceptance
  # where today it would not.
  acceptance:
    needs: ci
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.15.0
    permissions:
      contents: read
    with:
      provider: trino
      provider-display: Trino
      versions-file: .github/trino-versions.txt
      version-env: TRINO_VERSION
      expect-version-env: TRINO_EXPECT_VERSION
      # One compose project per version so matrices cannot share containers,
      # volumes or port bindings.
      compose-project-prefix: trino
      # Two coordinators at a time keeps memory bounded on the standard runner
      # while still letting the matrix finish in three waves.
      max-parallel: 2
      acceptance-timeout: 45
