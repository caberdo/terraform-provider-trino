# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.2.0
    # The Lint & Security job uploads the gosec SARIF result to code scanning.
    permissions:
      contents: read
      security-events: write
    with:
      provider: trino
      provider-display: Trino
      module: github.com/caberdo/terraform-provider-trino
      # The matrix source of truth, named here so it cannot drift from the
      # acceptance call below. Trino has no versions job (`versions-job` stays
      # at its `false` default), so nothing reads it in this caller yet.
      versions-file: .github/trino-versions.txt
      # A release pull request is the only change that moves VERSION: the
      # changelog check catches a mismatch before the merge instead of after it.
      changelog: true
      # Dependency scanning stays in the Lint & Security job, through
      # `./scripts/govulncheck.sh` and its accepted-findings list. The default
      # (`action`) would move it into a separate Vulnerability Scan job.
      govuln-mode: script
      # Replay the committed fuzz seed corpora without exploring new inputs.
      fuzz: true
      # The generated docs must not drift; `docs-mode: none` keeps the check in
      # the Test job, where it lives today.
      docs: true
      # Keeps the Coverage section of the job summary byte-identical.
      coverage-note: "Unit tests only: acceptance tests require `TF_ACC` and a live Trino coordinator."

  # Trino gates acceptance on the CI result on every trigger, pull requests and
  # the merge queue included. A caller cannot express `needs.<job>.result`
  # across a reusable-workflow boundary, so `needs: ci` is the only faithful
  # spelling: a failing or skipped `ci` skips acceptance, exactly as a failing
  # `test` did before.
  acceptance:
    needs: ci
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.2.0
    permissions:
      contents: read
    with:
      provider: trino
      provider-display: Trino
      versions-file: .github/trino-versions.txt
      version-env: TRINO_VERSION
      expect-version-env: TRINO_EXPECT_VERSION
      # One compose project per version so matrices cannot share containers,
      # volumes or port bindings.
      compose-project-prefix: trino
      # Two coordinators at a time keeps memory bounded on the standard runner
      # while still letting the matrix finish in three waves.
      max-parallel: 2
      acceptance-timeout: 45
